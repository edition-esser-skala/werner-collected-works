lyrics:
  Alle Weld iſt nun betranget,\\
  an dem Joch der Armueth hanget,\\
  wer hilfft wohl auß dißer Noth?\\
  Jene große Frau der Armen,\\
  die will aller ſich erbarmen,\\
  ſie erzwinget alls bey Gott.\\[1ex]
  Ein Menſch jezt den andren druket,\\
  nur der Arme wird gezukhet,\\
  weiß nicht wo er Hilff mehr findt.\\
  Solchen wolt ich weißlich lehren,\\
  daß Er ſolt Mariam ehren,\\
  dan ſie hilfft nur gar geſchwind.\\[1ex]
  Alle Lieb hat nun ein Ende,\\
  Haß, Verfolgung geht behände\\
  jenen auf den Fueßtrit nach.\\
  Niemand woll darob ſich kränkhen,\\
  ſtäts nur an Mariam denkhen,\\
  ſie errett auß aller Noth.
