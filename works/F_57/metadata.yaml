lyrics:
  Jesu corona celsior\\
  et veritas sublimior\\
  qui confitenti servulo\\
  reddis perenne praemium.\\[1ex]
  Anni reverso tempore\\
  dies illuxit lumine\\
  quo sanctus hic de corpore\\
  migravit inter sydera.\\[1ex]
  Patri perennis gloria\\
  natoque Patris unico\\
  sanctoque sit Paraclito\\
  per omne semper saeculum.\\[1ex]
  (Cantus Index 830352.1)
