lyrics:
  Erbarmet euch ihr Freundt, auch ihr Bekandte,\\
  aufs wenigſt doch anheunt vorvußbetrangte,\\
  erweget doch, erweg’t die ſchwäre Peyn ſo wir nun füllen,\\
  mit eur’n Gebett allein könnt ihr ſie ſtillen.\\
  Bezahlet unſre Schuld, die wir begangen,\\
  ihr könnt unß Gottes Huld gar leicht erlangen.\\[1ex]
  Almoßen reichet dar nach eur’n Gefallen,\\
  Gott laßt ſich auch ſogar darmit bezahlen,\\
  ein Faſten auch, ein Faſten ſtellet an wie d’Schrifft thuet weißen,\\
  mit der kan jederman unß arme ſpeißen.\\
  Ein Beichtcommunion, die Sünd bereuen,\\
  diß kan unß würcklich ſchon auß Noth befreyen.
