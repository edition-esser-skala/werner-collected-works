lyrics:
  Tauet ihr Himmel und trieffet herab\\
  jene ſo herrlich verſprochene Gaab,\\
  Jesum den Schylla und Heyland der Weld,\\
  daß Er unß alle\\
  von Adams Falle\\
  wider zur Huld und zur Gnaden herſtellt.\\[1ex]
  Traurt nicht mehr, betrante Herzen,\\
  legt beyſeit all büttern Schmerzen.\\
  Der Heyland khomt ſchon angelangt,\\
  darum die Gnadenzeit anfangt.\\
  Daher bereithet Herz und Gmüeth\\
  weil ſchon die Blume Jeſse blüeht.\\[1ex]
  Fünſternißen ſeynd vergangen,\\
  alß diß Liecht hat angefangen,\\
  in der Schooß der Jungfrau ruehet Er bereith.\\
  Biß noch auf eine kurze Zeit,\\
  ihr werd ihn ſehn in Kindsgeſtalt,\\
  der unſre Schulden all bezahlt.\\[1ex]
  Eja laßt uns höchſt erfreuen,\\
  unſre Sünd anbey bereuen,\\
  daß unß dißer Seelenfreund\\
  mit ſeinem Liecht beſcheint.
