lyrics:
  Tibi Christe splendor Patris\\
  vita virtus cordium\\
  in conspectu angelorum\\
  votis voce psallimus\\
  alternantes concrepando\\
  melos damus vocibus.\\[1ex]
  Quo custode procul pelle\\
  Rex Christe piissime\\
  omne nefas inimici\\
  mundos corde et corpore\\
  paradiso redde tuo\\
  nos sola clementia.\\[1ex]
  Gloriam Patri melodis\\
  personemus vocibus\\
  gloriam Christo canamus\\
  gloriam Paraclito\\
  qui trinus et unus Deus\\
  extat ante saecula.\\[1ex]
  (Cantus Index 008403)
