  –     & org  & Since org and vlne parts are missing in the only
                 extant source, this voice has been reconstructed
                 by the editor in bars 1–22 and 38–74.
                 Completion of the remaining bars is left
                 as an exercise for the period performer. \\
  62–74 & T    & In \B1, these bars have been cancelled by different hand
                 and replaced with novel bars. \\
