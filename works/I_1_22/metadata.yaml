toe: |
  14–62 & – & In the parts of \A1, the key signature of this section
              is inconsistent: In vl~1 and~2, the complete section is in
              G~major. In S~1, S~2, vlne, and org, the section starts in
              C~major and changes to G~major at a line break preceding
              bar~36 (S~1), 37 (S~2), 40 (org), or 43 (vlne).
              Here, the key signatures have been standardized
              to C~major (bars 14–34) and G~major (bars 35–62) in all parts. \\
  43   & S 1 & rhythm of 1st \quarterNote\ in \A1: \sixteenthNote-tuplet \\
