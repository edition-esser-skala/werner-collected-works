lyrics:
  Puer natus in Bethlehem,\\
  unde gaudet Jerusalem.\\
  Ein Kind gebohrn zu Bethlehem,\\
  des freuet ſich Jerusalem.\\[1ex]
  Hic jacet in praesepio,\\
  qui regnat sine termino.\\
  Hier ligt er in dem Krippelein\\
  und beherſchet unß insgemein.\\[1ex]
  Gloria tibi Domine\\
  qui natus es de Virgine.\\
  Ehr ſey dir ô mein Jesulein\\
  gebohren auß der Jungfrau rein.
