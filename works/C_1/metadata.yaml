lyrics:
  \textsb{3}\\
  Homo natus de muliere\\
  brevi vivens tempore\\
  repletur multis miseriis.\\
  Qui quasi flos egreditur\\
  et conteritur et fugit velut umbra\\
  et nunquam in eodem statu permanet.\\
  Et dignum ducis super eum oculos tuos\\
  et adducere eum tecum in iudicium.\\
  Quis potest facere mundum\\
  de immundo conceptum semine\\
  nonne tu qui solus es.\\
  Breves dies hominis sunt,\\
  numerus mensium eius apud te est,\\
  constituisti terminos eius\\
  qui preterire non poterunt.\\
  (\bibleverse{Job}(14:1–5))
