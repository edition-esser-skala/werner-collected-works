lyrics:
  Heüt tratt der Jacobs Stern\\
  ins ſchöne Himmelszeichen\\
  der keuſchen Jungfrau ein\\
  dem müßt der helle Schein\\
  der goldnen Sonnen weichen\\
  und neigen ſich von fern.\\
  Es war in gantzen Thürekreiß\\
  kein Zeichen je ſo rein\\
  die Jungfrau nur erhielt den Preis\\
  ſie ſolt die würdigſt ſeyn.\\[1ex]
  Hier war kein Fünſternuß\\
  in dieſen Stern zu ſehen\\
  es war allß klar und hell\\
  daß dunckle Schattenfehl\\
  muſt nur auch rückwerths gehen\\
  der Höllen zum Verdruß.\\
  Es würd demnach die fünſtre Welt\\
  in allweeg hell beleücht\\
  und gleichſam auf daß neu beſeelt\\
  mit Gnadenthau befeücht.\\[1ex]
  Es kam der Gnadenſtern\\
  in d’Milchſtraß eingegangen\\
  die ihm den Wachsthum gab\\
  damit er könnt herab\\
  auf dieſe Welt gelangen\\
  und noch mehr Liecht beſchern.\\
  Wer ſollte dieſen Gnadenſchein\\
  nicht folgen williglich\\
  weil er will unſer Führer ſeyn\\
  und leithen ſicherlich.
