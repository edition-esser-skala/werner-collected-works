lyrics:
  O Maria semper pia\\
  nos afflictos conturbatos consolare.\\[1ex]
  Et in hoc procelloso mundi pelago\\
  naufragantes materno oculo respice.\\[1ex]
  Ut tua potenti virtute\\
  nos eripias ex hoc naufragio.\\[1ex]
  Ad te clamo Mater pia,\\
  te suspiro ô Maria,\\
  suspirantem explorantem\\
  pia Mater respice.\\[1ex]
  En me vexat mentis pavor,\\
  me enervat orci furor,\\
  te paventem et trementem\\
  chara Mater erige.\\
  Hinc me torquet vitae error,\\
  hinc cruentat mortis terror,\\
  aberrantem et labantem\\
  pia Mater corrige.\\[1ex]
  O beatissima Virgo Maria!\\
  Sis nobis dux in hac via\\
  ut post hanc mortalem vitam\\
  aeternam tecum in coelis jubilemus.\\[1ex]
  Alleluia.
