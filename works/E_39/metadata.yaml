lyrics:
  Wäll heut dä Tag ſo freudenreich\\
  ſo ſtimmär all mit bey,\\
  und blaſen alleſamt zugleich\\
  auf unßrä Schallämay.\\
  Mär wölln dem Kindlein musicirn\\
  ſo dort ligt auf dem Heu,\\
  und wöllns aufs beſte venärirn\\
  mit unßrä Meladay.\\[1ex]
  Mär laßen unßri Stadtleuth gehn\\
  mit ihrä Policei,\\
  wölln liebä bey dem Heyland ſtehn\\
  mit vollä Lieb und Reu.\\
  Er wird uns ſegnä mildiglich\\
  und gibt uns noch darbey,\\
  daß mir äinſt kömä ſicherlich\\
  ins Himmelreich ganz frey.\\[1ex]
  Äs gibt ja Streit jezt in dä Stadt\\
  ſo vill und mancherley,\\
  daß oäner ſchier koä Bleibens hat\\
  vor lautä Käjerey.\\
  Wölln liebä bey dem Krippel ſeyn,\\
  da ſämä ja ganz frey,\\
  s’Kind gibt uns Ruh ins Herz hinein,\\
  den Himmel noch darbey.
