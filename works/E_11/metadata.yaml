lyrics:
  Heut mueß jene Sonne weichen,\\
  die daß Rund der Weld beleucht,\\
  Mond und Sterne mueß erbleichen,\\
  nichts Mariae ſich vergleicht.\\
  Goldrubinen, Hyacinthen,\\
  und waß man khan Edles finden,\\
  iſt alß eytler Staub geacht\\
  wan man dißen Schaz betracht.\\[1ex]
  Wer hat ſich wohl je erkheket,\\
  daß Er gründlich ßagen khan,\\
  keine Sünd hab ihn beflekhet,\\
  Er ſey frey und loß davon.\\
  Alle Zungen müeßen ſchweigen\\
  und mit einem Eyd bezeugen,\\
  nur Maria ſey quitirt,\\
  daß ſie keine Sünd berührt.\\[1ex]
  Sie allein khan billich prangen\\
  gleich der keuſchen Lilienblum,\\
  weil ſie ohne Sünd empfangen,\\
  ſo gebührt der größte Ruhm,\\
  Ihr alleinig unter allen,\\
  dan ſo hat es Gott gefallen,\\
  weil Er ſie von Ewigkheit\\
  ſchon zur Wohnung vorbereith.\\[1ex]
  So vill Notten, ſo vill Kronen\\
  wünſchte ich anjez zur Hand,\\
  dich Mariam zu belohnen\\
  alß mit einem Ehrenband,\\
  ſo vill Lobſprüch heut geſchehen\\
  wünſcht ich auß mein Mund zu gehen,\\
  dir zu zeig’n mit Lieb und Treu,\\
  waß ein rechter Dienner ſey.
