toe: |
  –  & –  & vla  & In \B1, there is no staff for vla in movements 3, 4, 10–12,
                   14, 17–21, and 23, 25–29. Here, a vla part has been added
                   by the editor to these movements.
                   In arias (no. 10, 12, 14, 17, 21, 23, 25, 27),
                   the vla plays in unison with bc whenever the voice
                   pauses during the first section.
                   In accompagnatos (no. 11, 18, 20, 26, 28),
                   it plays unison with bc.
                   In choruses (no. 3, 4, 19, 20, 26, 28, 29),
                   it generally plays unison with T in fugues,
                   and unison with bc otherwise. \\
