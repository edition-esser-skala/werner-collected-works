toe: |
  –  & –  & vla  & In \B1, there is no staff for vla in movements 3, 4.
                   Here, a vla part has been added
                   by the editor to these movements.
                   In arias (no. XXX), the vla plays in unison
                   with bc whenever the voice pauses during the first section.
                   In accompagnatos (no. XXX), it plays
                   unison with bc.
                   In choruses (no. 3, 4), it generally plays unison
                   with T in fugues, and unison with bc otherwise.
