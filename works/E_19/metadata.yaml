toe: |
  23 & vl 2 & rhythm of 4th \eighthNote\ in \A1: e′32–f′32–g′16 \\
lyrics: |
  \begin{multicols}{2}
  \textsb{1}\\
  \textit{Der zornige Vater}\\
  So ſey es dan beſchloſſen,\\
  weil ſich der Sünder nicht\\
  zur Reu und Bueß will kheren,\\
  khein Gnad noch Hilff begehren,\\
  ſo werd ich ihn verſtoßen\\
  von meinem Angeſicht.\\[1ex]
  \textit{Die Mutter der Barmherzigkeit}\\
  Halt ein mein liebſter Sohne\\
  umb deiner Muetter Willn,\\
  gedenkhe jener Schmerzen,\\
  ſo ich empfund im Herzen,\\
  ich bitte dich verſchone,\\
  laß deine Rache ſtilln.\\[1ex]
  \textit{Vater}\\
  Die Laſter ſeyn zu groß.\\[1ex]
  \textit{Mutter}\\
  Betracht doch diße Schoß\\
  die dich liebreich getragen.\\[1ex]
  \textit{Vater}\\
  Ich khan dir nichts verſagen,\\
  doch mueß die Grechtigkeit\\
  ihr Maß und Zihl erreichen.\\[1ex]
  \textit{Mutter}\\
  Ach zeig Barmherzigkeit\\
  und laſſe dich erweichen.

  \textsb{2}\\
  \textit{Vater}\\
  Verlange alle Gnaden,\\
  die nur erdenklich ſeyn,\\
  laß mich den Sünder ſtraffen,\\
  in ßein Verderben raffen,\\
  und ihn ſchmerzhafft beladen\\
  mit Jammer, Angſt und Peyn.\\[1ex]
  \textit{Mutter}\\
  Ach laß dich doch bewegen,\\
  hier ſehe meine Brüſt,\\
  die du so offt geßogen,\\
  mit Lieb an dich gezogen,\\
  ertheill ihm deinen Seegen,\\
  gib ihm noch Lebensfriſt.
  \columnbreak

  \textit{Vater}\\
  Er bleibet doch verhartt.\\[1ex]
  \textit{Mutter}\\
  Es iſt der Menſchen Arth,\\
  daß ſie zur Sünd geneiget.\\[1ex]
  \textit{Vater}\\
  Jedoch hab ich gezeiget,\\
  daß ich langmüetig ßey,\\
  ihr Unglickh nicht begehre.\\[1ex]
  \textit{Mutter}\\
  Umb deiner Muetter Treu\\
  doch ihnen Gnad beſchere.

  \textsb{3}\\
  \textit{Vater}\\
  Ô Muetter dein Verlangen\\
  iſt zwar dermaßen groß,\\
  doch bin ich faſt bezwungen,\\
  dein Bitt hat dir gelungen,\\
  du haſt mein Herz gefangen,\\
  der Sünder iſt nun loß.\\[1ex]
  \textit{Mutter}\\
  Nun bin ich voll der Freude,\\
  der Sünder hat Pardon,\\
  mich khan nichts ſo ergözen,\\
  khein Freud iſt mehr zu ſchäzen\\
  alß wan ich noch beyzeiten\\
  dem Menſchen helffen khan.\\[1ex]
  \textit{Vater}\\
  Diß gſchieht zuliebe dir.\\[1ex]
  \textit{Mutter}\\
  Ô Sohn verzeyhe mir,\\
  mein Herz iſt ſo beſchaffen.\\[1ex]
  \textit{Vater}\\
  Daß ich niemand ſoll ſtraffen,\\
  dahero ſollen dich\\
  die Sünder hoch verehren.\\[1ex]
  \textit{Mutter}\\
  Diß einzig wünſche ich,\\
  daß ſie ſich all bekheren.
  \end{multicols}
