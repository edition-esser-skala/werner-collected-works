lyrics:
  Alle, die Verlangen tragen,\\
  neue Zeitung anzuhörn,\\
  denen will ich troſtreich ßagen,\\
  waß ſie wünſchen und begehrn.\\
  Engelland hat ſich erbothen\\
  unſrer großen Königin,\\
  ſendet ab den Himmelsbothen,\\
  will ſeyn unßre Helfferin.\\[1ex]
  Ja ſogar ein Prinz iſt khomen\\
  auß dem ſchönen Engelland,\\
  hat ſein Wohnsiz aufgenohmen\\
  bey Mariam all bekhandt.\\
  Er wird ſtreitten und beßigen\\
  unſre ſtarkhe Seelenfeund,\\
  alle müeßen unterligen,\\
  obſchon Millionen ſeynd.\\[1ex]
  Ob der Feund zwar überwunden\\
  jene Veſtung außerwöhlt,\\
  hat man doch nun Hilff gefunden,\\
  daß Er wird zu Boden gfällt.\\
  Wilſtu wißen, waß ich meine,\\
  durch daß veste Citadell,\\
  ich verſtehe insgemeine\\
  die ſo Edle Menſchen Seel.\\[1ex]
  Kommt es Endlich einſt zum ſchlagen,\\
  wan ſich Leib und Seele ſcheidt,\\
  darffſtu keineswegs verzagen,\\
  weil die Hülff ſchon zuebereith.\\
  Wirſt Mariam nicht verlaßen,\\
  da ſie dir nun bieth die Hand,\\
  gehſtu ſicher jene Straßen\\
  ins gewünſchte Engelland.
