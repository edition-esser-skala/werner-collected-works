lyrics:
  Schönſte Jungfrau unter allen\\
  du allein haſt Gott gefallen\\
  deine Schönheit nahm ihn ein\\
  daß du ſolſt ein Mutter ſeyn.\\
  Er auf dich allein wolt zihlen\\
  unter hunderttauſend villen\\
  vor ein Mutter deines Sohn\\
  gib dein Herz vor deßen Thron.\\[1ex]
  Es ſey tauſentmahl geprißen\\
  Lob und Ehr zugleich erwißen\\
  allen Glidern in dein Leib\\
  ô du makelreines Weib.\\
  Wir bedancken uns beyneben\\
  daß du haſt drey Tropfen geben\\
  von dein reinen keuſchen Bluet\\
  zu dem Leib vors höchſte Guet.\\[1ex]
  Auch gebenedeyte Augen\\
  die ihr Jesum kontet ſchauen\\
  dauſentmahl ſey auch gegrüeſt\\
  ô du treues Paar der Brüſt.\\
  In euch pflegt ſchon einzuſchießen\\
  jene Milch die bald wird fließen\\
  in den Mund vor jenes Kind\\
  welches nimbt hinweg die Sünd.\\[1ex]
  Ich mich mach zu deinen Füeßen\\
  will demietig ſelbe grießen\\
  auch den Schnee der reinen Händ\\
  küß im Geiſt ich ohne End.\\
  Auch die Roßen die da hangen\\
  an den Lefzen an den Wangen\\
  auch des Halßes Helffenpein\\
  ſoll von mir gepryßen ſeyn.\\[1ex]
  Daß du ſchwarz die Schrifft zwar ßaget\\
  über daß zwar niemandt klaget\\
  aber nur den Augen nach\\
  ich mir die Gedancken mach.\\
  Dich nur ſchwarz machen die Közer\\
  jene Lugner jene Schwäzer\\
  doch biſt weißer alß der Schnee\\
  ich vor deine Schönheit ſteh.
