toe: |
  –  & –  & vla  & In \B1, a staff for vla only appears in movements 1, 7.
                   Here, a vla part has been added
                   by the editor to these movements.
                   In arias (no. 4, 6, 8), the vla plays in unison
                   with bc whenever the voice pauses during the first section.
                   In accompagnatos (no. ), it plays
                   unison with bc.
                   In choruses (no. ), it generally plays unison
                   with T~2 in fugues, and unison with bc otherwise. \\
