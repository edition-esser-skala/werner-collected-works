lyrics:
  In dulci jubilo,\\
  nun ſinget und seydt froh,\\
  unßers Herzens Wohne\\
  ligt in praesepio\\
  und leuchtet alß die Sonne\\
  Matris in gremio.\\
  Alpha es et O,\\
  Alpha es et O.\\[1ex]
  Ô Jesu Parvule,\\
  nach dir iſt mir ſo weh,\\
  tröſt mir mein Gemüethe,\\
  ô Puer optime,\\
  durch alle deine Güethe,\\
  ô Princeps gloriae.\\
  Trahe me post te,\\
  trahe me post te.\\[1ex]
  Mater et Filia\\
  iſt Jungfrau Maria,\\
  wir wären verlohren\\
  per nostra Crimina,\\
  ſo haſt du unß gebohren\\
  Coelorum gaudia.\\
  Maria hülff unß dar,\\
  Maria hülff unß dar.
