lyrics:
  Laſt ab von euren Trauren\\
  ihr gekränckte Herzen,\\
  wie lang ſoll an noch dauren\\
  ſo überhauffter Schmerzen.\\
  Ich zeig euch einen Weege\\
  und allzu ſichern Steege,\\
  wo ihr werd Hoffnung finden,\\
  zum Nachlaß eurer Sünden.\\[1ex]
  Die Mutter unſers Herren\\
  iſt die ſtarcke Stüzen,\\
  ſie wird euch gwiß erhören,\\
  vor allen Unheyl ſchützen.\\
  So eyllet dan behende,\\
  und ſtrecket eure Hände,\\
  ſie wird die Wunden heylen,\\
  auch Gnad hierzu ertheillen.\\[1ex]
  So laſſet uns dan gehen\\
  weill ſie ſchon ganz willig,\\
  all denen beyzuſtehen\\
  die ſie verehren billich.\\
  Wür wolln zum Angedenken\\
  ihr unſre Herzen ſchenken,\\
  darvor wird ſie erwerben,\\
  uns einſtens wohl zu ſterben.
