lyrics:
  Beglückter Edens Garten,\\
  darin die größte Luſtbarkeit\\
  mit all erwünſchter Süeßigkeit\\
  unß ſtunde zu erwarthen.\\
  Doch wird man auch geſtehen,\\
  daß niemahls ſey an einem Orth\\
  ein größers Unheyl alß aldorth\\
  durch Adams Fall geſchehen.\\[1ex]
  Diß mueſte ſeyn gerochen,\\
  dieweil hierdurch der höchſte Gott\\
  in ſeim Befelh nur war geſpodt,\\
  es wurd der Stab gebrochen;\\
  wir arme Adams Erben\\
  verſcherzten alle Gnad und Huld\\
  und ſolten wegen diſer Schuld\\
  des ewign Todes ſterben.\\[1ex]
  Doch wurde Frid getroffen,\\
  dieweil ſchon die Barmherzigkeit\\
  beſigte die Gerechtigkeit,\\
  da war auch Gnad zu hoffen.\\
  Gott ließe ſich gefallen,\\
  damit wir möchten insgemein\\
  von dißer Schuld befreyet ſeyn,\\
  vor jederman zu zahlen.\\[1ex]
  Nun kham es auf dem Willen\\
  bey einer Edlen Jungfrau rein\\
  die ſolt ein Mitgehülffin ſeyn,\\
  diß Gheimnuß zu erfüllen,\\
  und ßehet wie beſcheiden\\
  ſie ſich in ſolche hohe Gnad\\
  gehorßamlich ergeben hat\\
  zu unßern gröſten Freuden.
